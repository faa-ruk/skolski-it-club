<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Wireframe desktop i mobilnog prikaza</title><desc id="desc">Shematski raspored zaglavlja, hero sekcije, kartica, projekata i kontakt forme.</desc><rect width="1200" height="780" fill="#f2f2eb"/><text x="60" y="46" font-family="Arial" font-size="20" font-weight="bold" fill="#172323">WIREFRAME — DESKTOP</text><rect x="60" y="70" width="820" height="48" rx="5" fill="#fff" stroke="#7c8780"/><text x="78" y="100" font-family="Arial" font-size="14" fill="#172323">LOGO</text><text x="585" y="100" font-family="Arial" font-size="13" fill="#172323">O klubu　Aktivnosti　Projekti　Pridruži se</text><rect x="60" y="137" width="510" height="215" rx="5" fill="#fff" stroke="#7c8780"/><text x="82" y="174" font-family="Arial" font-size="13" fill="#68736e">EYEBROW</text><rect x="82" y="190" width="400" height="48" rx="3" fill="#dfe1d7"/><rect x="82" y="246" width="330" height="19" rx="3" fill="#e8e9e1"/><rect x="82" y="285" width="130" height="38" rx="4" fill="#c7f36b"/><text x="91" y="310" font-family="Arial" font-size="12" fill="#172323">CTA DUGME</text><rect x="590" y="137" width="290" height="215" rx="5" fill="#172522"/><rect x="610" y="161" width="250" height="160" rx="3" fill="#263a32"/><text x="635" y="216" font-family="monospace" font-size="14" fill="#c7f36b">&lt; IDEJA / KOD / PROJEKAT &gt;</text><rect x="60" y="370" width="820" height="102" rx="5" fill="#fff" stroke="#7c8780"/><text x="82" y="407" font-family="Arial" font-size="14" fill="#172323">O KLUBU + KRATAK OPIS</text><rect x="82" y="420" width="230" height="30" fill="#e8e9e1"/><rect x="327" y="420" width="230" height="30" fill="#e8e9e1"/><rect x="572" y="420" width="285" height="30" fill="#e8e9e1"/><text x="60" y="510" font-family="Arial" font-size="14" fill="#172323">AKTIVNOSTI / PROJEKTI — KARTICE</text><rect x="60" y="527" width="255" height="94" rx="4" fill="#fff" stroke="#