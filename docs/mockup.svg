<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Mockup početne stranice Školskog IT kluba</title><desc id="desc">Vizualni prijedlog web stranice u krem, tamnozelenoj i svijetlozelenoj paleti.</desc><rect width="1200" height="760" fill="#f5f4ed"/><rect x="48" y="32" width="1104" height="58" rx="5" fill="#f5f4ed" stroke="#dfe1d7"/><rect x="70" y="45" width="34" height="34" rx="9" fill="#c7f36b"/><text x="75" y="67" font-family="monospace" font-size="12" fill="#172323">&lt;/&gt;</text><text x="113" y="67" font-family="Arial" font-size="16" font-weight="bold" fill="#172323">IT klub</text><text x="760" y="67" font-family="Arial" font-size="12" fill="#59645e">O klubu　Aktivnosti　Projekti</text><rect x="1017" y="48" width="112" height="30" rx="4" fill="#172323"/><text x="1030" y="68" font-family="Arial" font-size="11" fill="#fff">Pridruži se</text><text x="72" y="155" font-family="monospace" font-size="11" fill="#667263">● IDEJE POSTAJU STVARNOST</text><text x="72" y="222" font-family="Arial" font-size="57" font-weight="bold" letter-spacing="-3" fill="#172323">Učimo tehnologiju</text><text x="72" y="280" font-family="Arial" font-size="57" font-weight="bold" letter-spacing="-3" fill="#7b9f3d">stvarajući.</text><text x="74" y="321" font-family="Arial" font-size="15" fill="#697470">Mjesto za učenike koje zanimaju programiranje,</text><text x="74" y="343" font-family="Arial" font-size="15" fill="#697470">dizajn i nove tehnologije.</text><rect x="72" y="373" width="166" height="43" rx="4" fill="#172323"/><text x="88" y="399" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Pridruži se klubu ↗</text><text x="260" y="400" font-family="Arial" font-size="12" font-weight="bold" fill="#172323">Pogledaj projekte ↓</text><rect x="590" y="135" width="535" height="300" rx="9" fill="#172522"/><path d="M590 185H1125" stroke="#ffffff" stroke-opacity=".12"/><circle cx="612" cy="160" r="4" fill="#e48c73"/><circle cx="626" cy="160" r="4" fill="#c7f36b"/><circle cx="640" cy="160" r="4" fill="#8ed8cc"/><text x="855" y="164" font-family="monospace" font-size="10" fill="#97a39a">prvi-projekat.js</text><text x="630" y="223" font-family="monospace" font-size="13" fill="#c6a9ed">const</text><text x="681" y="223" font-family="monospace" font-size="13" fill="#c7f36b"> ideja = "moja ideja";</text><text x="630" y="260" font-family="monospace" font-size="13" fill="#c6a9ed">function</text><text x="713" y="260" font-family="monospace" font-size="13" fill="#f3cb78"> napravi(ideja) {</text><text x="650" y="297" font-family="monospace" font-size="13" fill="#8ed8cc">uči();</text><text x="650" y="334" font-family="monospace" font-size="13" fill="#8ed8cc">probaj(ideja);</text><text x="630" y="371" font-family="monospace" font-size="13" fill="#c6a9ed">return</text><text x="690" y="371" font-family="monospace" font-size="13" fill="#c7f36b"> "uspjeh!";</text><rect x="1060" y="196" width="120" height="28" rx="3" fill="#c7f36b"/><text x="1070" y="214" font-family="monospace" font-size="9" fill="#172323">&lt; HTML / CSS / JS &gt;</text><text x="73" y="488" font-family="Arial" font-size="26" font-weight="bold" fill="#172323">Učenje je bolje kad pravimo zajedno.</text><rect x="72" y="515" width="330" height="112" rx="5" fill="#eeeee5"/><rect x="418" y="515" width="330" height="112" rx="5" fill="#eeeee5"/><rect x="764" y="515" width="361" height="112" rx="5" fill="#eeeee5"/><text x="92" y="551" font-family="Arial" font-size="16" font-weight="bold" fill="#172323">{ }　Učimo osnove</text><text x="92" y="581" font-family="Arial" font-size="12" fill="#697470">HTML, CSS, JavaScript i više.</text><text x="438" y="551" font-family="Arial" font-size="16" font-weight="bold" fill="#172323">↗　Pravimo projekte</text><text x="438" y="581" font-family="Arial" font-size="12" fill="#697470">Male ideje pretvaramo u praksu.</text><text x="784" y="551" font-family="Arial" font-size="16" font-weight="bold" fill="#172323">✳　Dijelimo znanje</text><text x="784" y="581" font-family="Arial" font-size="12" fill="#697470">Učimo jedni od drugih.</text><text x="73" y="684" font-family="monospace" font-size="10" fill="#667263">PALETA: KREM #F5F4ED　 TAMNOZELENA #172323　 SVJETLOZELENA #C7F36B</text></svg>
